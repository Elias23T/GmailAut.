# Apache de cPanel -> API en 127.0.0.1:3300. Va en
# /etc/apache2/conf.d/userdata/ssl/2_4/correoia/correo.nucleasystems.com/proxy.conf
# y se activa con /scripts/rebuildhttpdconf y un reinicio graceful de Apache.
ProxyRequests Off
# El SDK MCP solo acepta el Host publico (allowed_hosts).
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"

ProxyPass "/api/" "http://127.0.0.1:3300/" retry=0 timeout=60
ProxyPassReverse "/api/" "http://127.0.0.1:3300/"
ProxyPass "/mcp" "http://127.0.0.1:3300/mcp" retry=0 timeout=60
ProxyPassReverse "/mcp" "http://127.0.0.1:3300/mcp"
ProxyPass "/oauth/" "http://127.0.0.1:3300/oauth/" retry=0 timeout=60
ProxyPassReverse "/oauth/" "http://127.0.0.1:3300/oauth/"
ProxyPass "/.well-known/oauth-authorization-server" "http://127.0.0.1:3300/.well-known/oauth-authorization-server" retry=0 timeout=30
ProxyPass "/.well-known/oauth-protected-resource" "http://127.0.0.1:3300/.well-known/oauth-protected-resource" retry=0 timeout=30

<LocationMatch "^/(api/|mcp|oauth/|\.well-known/oauth-)">
    LimitRequestBody 65536
    Require all granted
</LocationMatch>

# Mismos encabezados que deploy/caddy/Caddyfile.example.
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "no-referrer"
Header always set Strict-Transport-Security "max-age=31536000"
Header always set Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
